name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Rebuild Discourse
    runs-on: self-hosted
    # Backstop so a stuck step can't hold the only runner for GitHub's 6h limit.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Must run BEFORE tagging the rollback target below: `docker image prune -a`
      # untags any reference with no container pointing at that exact tag, even
      # when the same image ID is still in use under its primary tag -- so if
      # this ran after tagging, it would immediately strip the brand-new
      # `:rollback` tag we just created (confirmed in production: the prune log
      # showed "untagged: local_discourse/app:rollback" with "0B reclaimed",
      # i.e. the image stayed but the rollback tag was gone before the deploy
      # even needed it).
      - name: Free up Docker disk space
        run: |
          sudo docker image prune -af
          sudo docker builder prune -af

      - name: Tag current image as rollback target
        run: |
          cd /var/discourse
          if sudo docker inspect app >/dev/null 2>&1; then
            current_image="$(sudo docker inspect app --format '{{.Image}}')"
            sudo docker tag "$current_image" local_discourse/app:rollback
            echo "Tagged currently running image ($current_image) as local_discourse/app:rollback"
          else
            echo "No running 'app' container found -- nothing to preserve for rollback"
          fi

      - name: Write app.yml with secrets
        env:
          NVS_GITHUB_PAT: ${{ secrets.NVS_GITHUB_PAT }}
          DISCOURSE_DB_PASSWORD: ${{ secrets.DISCOURSE_DB_PASSWORD }}
          DISCOURSE_SMTP_USERNAME: ${{ secrets.DISCOURSE_SMTP_USERNAME }}
          DISCOURSE_SMTP_PASSWORD: ${{ secrets.DISCOURSE_SMTP_PASSWORD }}
          DISCOURSE_S3_ACCESS_KEY_ID: ${{ secrets.DISCOURSE_S3_ACCESS_KEY_ID }}
          DISCOURSE_S3_SECRET_ACCESS_KEY: ${{ secrets.DISCOURSE_S3_SECRET_ACCESS_KEY }}
        run: |
          # mktemp creates the file 0600, and the trap removes it even when the
          # copy below fails (the step runs with -e), so the secrets never sit
          # in /tmp readable by other users.
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          python3 - << 'PYEOF' > "$tmp"
          import os, sys
          content = open('containers/app.yml').read()
          for placeholder, envvar in [
              ('<GITHUB_PAT>', 'NVS_GITHUB_PAT'),
              ('<DISCOURSE_DB_PASSWORD>', 'DISCOURSE_DB_PASSWORD'),
              ('<DISCOURSE_SMTP_USERNAME>', 'DISCOURSE_SMTP_USERNAME'),
              ('<DISCOURSE_SMTP_PASSWORD>', 'DISCOURSE_SMTP_PASSWORD'),
              ('<DISCOURSE_S3_ACCESS_KEY_ID>', 'DISCOURSE_S3_ACCESS_KEY_ID'),
              ('<DISCOURSE_S3_SECRET_ACCESS_KEY>', 'DISCOURSE_S3_SECRET_ACCESS_KEY'),
          ]:
              content = content.replace(placeholder, os.environ[envvar])
          sys.stdout.write(content)
          PYEOF
          sudo cp "$tmp" /var/discourse/containers/app.yml

      - name: Write multisite.yml with secrets
        env:
          DISCOURSE_DB_PASSWORD: ${{ secrets.DISCOURSE_DB_PASSWORD }}
        run: |
          python3 - << 'PYEOF' | sudo tee /var/discourse/shared/standalone/multisite.yml > /dev/null
          import os, sys
          content = open('config/multisite.yml').read()
          content = content.replace('<DISCOURSE_DB_PASSWORD>', os.environ['DISCOURSE_DB_PASSWORD'])
          sys.stdout.write(content)
          PYEOF

      # `launcher bootstrap` only pulls this base image if no local copy already
      # exists under the tag -- otherwise it silently reuses whatever's cached,
      # which can go stale for months on a long-lived host like this runner.
      # Confirmed as the root cause of the 2026-11-04 production outage: the
      # exact same application code booted fine on UAT (which always builds on
      # a brand-new instance with zero Docker cache, forcing a real pull) but
      # crashed here with `libvips.so.42: cannot open shared object file`,
      # because this host's cached discourse/base:release predated the version
      # the current code's vips bindings need. Force a fresh pull every time so
      # production never again builds against a stale base image.
      - name: Pull latest base image
        run: sudo docker pull discourse/base:release

      - name: Build new image (site stays up during this step)
        run: cd /var/discourse && sudo ./launcher bootstrap app

      - name: Swap container (brief downtime ~30s)
        id: swap
        run: |
          cd /var/discourse
          sudo ./launcher destroy app
          sudo ./launcher start app

      - name: Wait for nginx and apply multisite fix
        run: |
          for attempt in $(seq 1 10); do
            if sudo docker exec app sv status nginx | grep -q "^run:"; then break; fi
            echo "Waiting for nginx to start ($attempt/10)..."; sleep 5
          done
          if ! sudo docker exec app sv status nginx | grep -q "^run:"; then
            echo "nginx did not start in time"
            sudo docker logs --tail 200 app
            exit 1
          fi
          sudo docker exec app bash -c '
            sed -i "/http_host != /,/^}/d" /usr/local/bin/configure-ssl
            /usr/local/bin/configure-ssl
            sv reload nginx
          '

      - name: Verify all sites are up
        run: |
          for site in navodians.com nitians.in iitians.in; do
            up=false
            for attempt in $(seq 1 10); do
              if [ "$(curl -sk --max-time 10 -o /dev/null -w '%{http_code}' https://$site/)" = "200" ]; then
                up=true
                break
              fi
              echo "Waiting for $site ($attempt/10)..."; sleep 5
            done
            if [ "$up" != true ]; then
              echo "$site did not come up in time"
              sudo docker logs --tail 200 app
              exit 1
            fi
            echo "$site is up"
          done

      # Captures the failed image's own logs before the rollback step below
      # destroys that container -- `docker logs` only exists for a container
      # that's still around, and `launcher destroy` removes it permanently.
      # Confirmed as a real gap on 2026-11-04: a production outage was fixed
      # by manually swapping back to the rollback image before this capture
      # existed, which meant the actual boot failure from the broken image
      # was never recorded anywhere.
      - name: Capture failed deploy logs
        if: failure() && steps.swap.outcome != 'skipped'
        run: sudo docker logs app > /tmp/failed-deploy-${{ github.run_id }}.log 2>&1 || true

      - name: Upload failed deploy logs
        if: failure() && steps.swap.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: failed-deploy-logs-${{ github.run_id }}
          path: /tmp/failed-deploy-${{ github.run_id }}.log
          retention-days: 14

      # Only runs once the old container is already gone (destroy succeeded,
      # whether or not start/nginx/site-verify succeeded after it) -- if
      # "Build new image" itself failed, swap's outcome is "skipped" and the
      # old container is still up untouched, so there's nothing to roll back.
      - name: Roll back to last known-good image on failure
        if: failure() && steps.swap.outcome != 'skipped'
        run: |
          cd /var/discourse
          if ! sudo docker image inspect local_discourse/app:rollback >/dev/null 2>&1; then
            echo "::error::Deploy failed and no rollback image is available (local_discourse/app:rollback not found) -- production may be down, manual intervention required immediately"
            exit 1
          fi

          echo "::error::Deploy failed after the container swap -- rolling back to the last known-good image"
          sudo docker tag local_discourse/app:rollback local_discourse/app:latest
          sudo ./launcher destroy app || true
          sudo ./launcher start app

          for attempt in $(seq 1 10); do
            if sudo docker exec app sv status nginx 2>/dev/null | grep -q "^run:"; then break; fi
            echo "Waiting for nginx to start after rollback ($attempt/10)..."; sleep 5
          done
          if ! sudo docker exec app sv status nginx 2>/dev/null | grep -q "^run:"; then
            echo "::error::nginx did not start after rollback -- manual intervention required immediately"
            sudo docker logs --tail 200 app
            exit 1
          fi
          sudo docker exec app bash -c '
            sed -i "/http_host != /,/^}/d" /usr/local/bin/configure-ssl
            /usr/local/bin/configure-ssl
            sv reload nginx
          '

          all_recovered=true
          for site in navodians.com nitians.in iitians.in; do
            up=false
            for attempt in $(seq 1 30); do
              if [ "$(curl -sk --max-time 10 -o /dev/null -w '%{http_code}' https://$site/)" = "200" ]; then
                up=true
                break
              fi
              sleep 5
            done
            if [ "$up" = true ]; then
              echo "$site recovered via rollback"
            else
              echo "::error::$site is still down after rollback -- manual intervention required immediately"
              all_recovered=false
            fi
          done

          if [ "$all_recovered" != true ]; then
            exit 1
          fi
          echo "::error::Rolled back to the last known-good image. The failed deploy above still needs investigation before retrying."
