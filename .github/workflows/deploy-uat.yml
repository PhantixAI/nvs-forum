name: Deploy to UAT

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]
    branches:
      - master

concurrency:
  group: uat-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy uat.nitians.in
    runs-on: ubuntu-latest
    # Generous backstop: bootstrap (~15 min) + the 30-min idle-delete wait at the end.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Determine version to deploy
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "version=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Ensure the UAT instance exists
        run: |
          if aws lightsail get-instance --instance-name uat-nitians >/dev/null 2>&1; then
            echo "uat-nitians already exists, reusing it"
            exit 0
          fi

          echo "uat-nitians not found, creating from snapshot"
          aws lightsail create-instances-from-snapshot \
            --instance-names uat-nitians \
            --availability-zone ap-south-1a \
            --instance-snapshot-name uat-nitians-base-snapshot \
            --bundle-id small_3_1 \
            --key-pair-name uat-nitians-key

          echo "Waiting for instance to be running..."
          until [ "$(aws lightsail get-instance-state --instance-name uat-nitians --query state.name --output text)" = "running" ]; do
            sleep 5
          done

          aws lightsail attach-static-ip --static-ip-name uat-nitians-ip --instance-name uat-nitians

          echo "Attaching persistent DB disk..."
          aws lightsail attach-disk \
            --disk-name uat-nitians-db-disk \
            --instance-name uat-nitians \
            --disk-path /dev/xvdf \
            --no-auto-mounting
          until [ "$(aws lightsail get-disk --disk-name uat-nitians-db-disk --query disk.isAttached --output text)" = "True" ]; do
            sleep 3
          done

          echo "Waiting for sshd to accept the SSH protocol handshake..."
          # A bare TCP accept (nc -z) can succeed while sshd is still starting up on a
          # freshly-booted instance, before it's ready to do the actual key exchange --
          # ssh-keyscan is the real readiness check.
          keys=""
          for attempt in $(seq 1 60); do
            keys="$(ssh-keyscan -H uat.nitians.in 2>/dev/null)"
            if [ -n "$keys" ]; then break; fi
            echo "Waiting for SSH host keys ($attempt/60)..."; sleep 5
          done
          if [ -z "$keys" ]; then
            echo "sshd never became ready for key exchange"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$keys" >> ~/.ssh/known_hosts

      - name: Write SSH key
        env:
          UAT_SSH_PRIVATE_KEY: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$UAT_SSH_PRIVATE_KEY" > ~/.ssh/uat_key
          chmod 600 ~/.ssh/uat_key
          # When the instance was reused (not freshly created this run), its host keys
          # were never scanned above -- do it now if missing.
          if ! ssh-keygen -F uat.nitians.in >/dev/null 2>&1; then
            ssh-keyscan -H uat.nitians.in >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: TEMP debug - find actual disk device path
        run: |
          ssh -i ~/.ssh/uat_key ubuntu@uat.nitians.in '
            echo "--- lsblk ---"; lsblk
            echo "--- /dev xvd/nvme ---"; ls -la /dev | grep -E "xvd|nvme" || true
          '

      - name: TEMP repair - fix incomplete discourse_docker clone on base image
        run: |
          ssh -i ~/.ssh/uat_key ubuntu@uat.nitians.in '
            set -e
            echo "--- before ---"; sudo ls -la /var/discourse
            # A reused instance may still have the uat container running from a
            # prior trigger, with /shared bind-mounted from /var/discourse/shared/uat
            # -- stop it first or the umount below fails with "target is busy".
            sudo docker stop uat >/dev/null 2>&1 || true
            # /var/discourse/shared/uat is the mountpoint for the persistent DB disk
            # (/dev/xvdf) -- unmount before rm -rf so a plain directory-tree wipe of
            # the launcher scaffolding can never touch the actual Postgres data,
            # which lives on the separate block device, not under /var/discourse.
            sudo mountpoint -q /var/discourse/shared/uat && sudo umount /var/discourse/shared/uat
            sudo rm -rf /var/discourse
            sudo git clone https://github.com/discourse/discourse_docker.git /var/discourse
            sudo chmod 700 /var/discourse
            sudo mkdir -p /var/discourse/shared/uat
            for attempt in $(seq 1 20); do
              [ -b /dev/xvdf ] && break
              echo "Waiting for /dev/xvdf to appear ($attempt/20)..."; sleep 3
            done
            if ! sudo blkid /dev/xvdf >/dev/null 2>&1; then
              echo "First-ever use of the persistent disk -- formatting it"
              sudo mkfs.ext4 -q /dev/xvdf
            fi
            sudo mount /dev/xvdf /var/discourse/shared/uat
            sudo mkdir -p /var/discourse/shared/uat/ssl
            sudo mkdir -p /var/discourse/shared/uat/log/var-log
            if ! grep -q "git remote set-url origin" /var/discourse/templates/web.template.yml; then
              sudo sed -i "100a\\        - sudo -H -E -u discourse git remote set-url origin \$git_url" /var/discourse/templates/web.template.yml
            fi
            echo "--- after ---"; sudo ls -la /var/discourse
            sudo ls -la /var/discourse/containers
            df -h /var/discourse/shared/uat
          '

      - name: Write containers/uat.yml with secrets and upload it
        env:
          NVS_GITHUB_PAT: ${{ secrets.NVS_GITHUB_PAT }}
          DISCOURSE_SMTP_USERNAME: ${{ secrets.DISCOURSE_SMTP_USERNAME }}
          DISCOURSE_SMTP_PASSWORD: ${{ secrets.DISCOURSE_SMTP_PASSWORD }}
          UAT_DISCOURSE_S3_ACCESS_KEY_ID: ${{ secrets.UAT_DISCOURSE_S3_ACCESS_KEY_ID }}
          UAT_DISCOURSE_S3_SECRET_ACCESS_KEY: ${{ secrets.UAT_DISCOURSE_S3_SECRET_ACCESS_KEY }}
          UAT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          python3 - << 'PYEOF' > "$tmp"
          import os, sys
          content = open('containers/uat.yml').read()
          for placeholder, envvar in [
              ('<GITHUB_PAT>', 'NVS_GITHUB_PAT'),
              ('<DISCOURSE_SMTP_USERNAME>', 'DISCOURSE_SMTP_USERNAME'),
              ('<DISCOURSE_SMTP_PASSWORD>', 'DISCOURSE_SMTP_PASSWORD'),
              ('<UAT_DISCOURSE_S3_ACCESS_KEY_ID>', 'UAT_DISCOURSE_S3_ACCESS_KEY_ID'),
              ('<UAT_DISCOURSE_S3_SECRET_ACCESS_KEY>', 'UAT_DISCOURSE_S3_SECRET_ACCESS_KEY'),
              ('<UAT_VERSION>', 'UAT_VERSION'),
          ]:
              content = content.replace(placeholder, os.environ[envvar])
          sys.stdout.write(content)
          PYEOF
          scp -i ~/.ssh/uat_key "$tmp" ubuntu@uat.nitians.in:/tmp/uat.yml
          ssh -i ~/.ssh/uat_key ubuntu@uat.nitians.in 'sudo mv /tmp/uat.yml /var/discourse/containers/uat.yml'

      - name: Build and swap (over SSH)
        run: |
          ssh -i ~/.ssh/uat_key ubuntu@uat.nitians.in '
            sudo bash -c "
              cd /var/discourse &&
              ./launcher bootstrap uat &&
              ./launcher destroy uat &&
              ./launcher start uat
            "
          '

      - name: Verify uat.nitians.in is up
        run: |
          up=false
          for attempt in $(seq 1 60); do
            if [ "$(curl -sk --max-time 10 -o /dev/null -w '%{http_code}' https://uat.nitians.in/)" = "200" ]; then
              up=true
              break
            fi
            echo "Waiting for uat.nitians.in ($attempt/60)..."; sleep 5
          done
          if [ "$up" != true ]; then
            echo "uat.nitians.in did not come up in time"
            ssh -i ~/.ssh/uat_key ubuntu@uat.nitians.in 'sudo docker logs --tail 200 uat'
            exit 1
          fi
          echo "uat.nitians.in is up"

      - name: TEMP seed - transfer production dump onto the UAT disk
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          echo "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H 52.66.136.102 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/prod_key ubuntu@52.66.136.102 '
            sudo docker cp app:/tmp/nitians_forum.dump /tmp/nitians_forum.dump
            sudo chmod 644 /tmp/nitians_forum.dump
          '
          scp -i ~/.ssh/prod_key ubuntu@52.66.136.102:/tmp/nitians_forum.dump /tmp/nitians_forum.dump
          rm -f ~/.ssh/prod_key
          scp -i ~/.ssh/uat_key /tmp/nitians_forum.dump ubuntu@uat.nitians.in:/tmp/nitians_forum.dump
          rm -f /tmp/nitians_forum.dump
          ssh -i ~/.ssh/uat_key ubuntu@uat.nitians.in '
            sudo docker cp /tmp/nitians_forum.dump uat:/tmp/nitians_forum.dump
            rm -f /tmp/nitians_forum.dump
          '

      - name: TEMP seed - restore production data into local DB and scrub PII
        run: |
          ssh -i ~/.ssh/uat_key ubuntu@uat.nitians.in 'sudo docker exec -i uat bash -s' <<'EOF'
          set -euo pipefail

          echo "=== drop bootstrap-empty DB, recreate ==="
          sudo -u postgres dropdb discourse
          sudo -u postgres createdb discourse

          echo "=== restore production dump ==="
          sudo -u postgres pg_restore -d discourse --no-owner --no-acl /tmp/nitians_forum.dump

          echo "=== fix ownership (dump has no-owner, restored as postgres) ==="
          sudo -u postgres psql discourse -c "REASSIGN OWNED BY postgres TO discourse;"

          echo "=== catch up migrations (dump may be behind this build's code) ==="
          su discourse -c 'cd /var/www/discourse && RAILS_ENV=production bundle exec rake db:migrate'

          echo "=== PII scrub (local discourse DB only) ==="
          sudo -u postgres psql discourse -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          UPDATE user_emails SET email = 'user+' || user_id || '+' || id || '@uat.invalid',
                                  normalized_email = 'user' || user_id || 'plus' || id || 'uatinvalid';
          UPDATE email_tokens SET email = 'user+' || user_id || '@uat.invalid';
          UPDATE email_change_requests SET old_email = 'user+' || user_id || '@uat.invalid',
                                            new_email = 'user+' || user_id || '@uat.invalid';
          DELETE FROM email_login_codes;
          DELETE FROM email_logs;
          DELETE FROM incoming_emails;
          DELETE FROM screened_emails;
          UPDATE users SET ip_address = NULL, registration_ip_address = NULL;
          UPDATE incoming_links SET ip_address = NULL;
          UPDATE user_histories SET ip_address = NULL, email = NULL;
          DELETE FROM user_ip_address_histories;
          DELETE FROM user_auth_tokens;
          DELETE FROM user_auth_token_logs;
          DELETE FROM user_api_keys;
          DELETE FROM user_second_factors;
          DELETE FROM user_security_keys;
          UPDATE user_passwords
          SET password_hash = md5(random()::text || clock_timestamp()::text || id::text),
              password_salt = md5(random()::text || clock_timestamp()::text || id::text || 'salt');
          UPDATE posts SET raw = '[redacted - UAT PII scrub]',
                           cooked = '<p>[redacted - UAT PII scrub]</p>',
                           raw_email = NULL
          WHERE topic_id IN (SELECT id FROM topics WHERE archetype = 'private_message');
          UPDATE topics SET title = 'Private message ' || id,
                             fancy_title = 'Private message ' || id,
                             excerpt = NULL
          WHERE archetype = 'private_message';
          UPDATE chat_messages SET message = '[redacted - UAT PII scrub]',
                                    cooked = '<p>[redacted - UAT PII scrub]</p>'
          WHERE chat_channel_id IN (SELECT id FROM chat_channels WHERE chatable_type = 'DirectMessage');
          COMMIT;
          SQL

          echo "=== verify ==="
          sudo -u postgres psql discourse -t -c "
          SELECT 'email_logs', count(*) FROM email_logs
          UNION ALL SELECT 'incoming_emails', count(*) FROM incoming_emails
          UNION ALL SELECT 'user_auth_tokens', count(*) FROM user_auth_tokens
          UNION ALL SELECT 'user_api_keys', count(*) FROM user_api_keys
          UNION ALL SELECT 'user_emails_total', count(*) FROM user_emails
          UNION ALL SELECT 'user_emails_still_real_domain', count(*) FROM user_emails WHERE email NOT LIKE '%@uat.invalid'
          "

          echo "=== cleanup dump ==="
          rm -f /tmp/nitians_forum.dump

          echo "=== restart app server ==="
          sv restart unicorn
          EOF

      - name: Re-verify uat.nitians.in after seeding
        run: |
          up=false
          for attempt in $(seq 1 60); do
            if [ "$(curl -sk --max-time 10 -o /dev/null -w '%{http_code}' https://uat.nitians.in/)" = "200" ]; then
              up=true
              break
            fi
            echo "Waiting for uat.nitians.in ($attempt/60)..."; sleep 5
          done
          if [ "$up" != true ]; then
            echo "uat.nitians.in did not come back up after seeding"
            ssh -i ~/.ssh/uat_key ubuntu@uat.nitians.in 'sudo docker logs --tail 200 uat'
            exit 1
          fi
          echo "uat.nitians.in is up after seeding"

      - name: Idle-delete the instance after 30 minutes of inactivity
        run: |
          # If a newer trigger arrives during this wait, cancel-in-progress kills
          # this job before it reaches the delete call below, so the instance
          # survives and the next run's "Ensure the UAT instance exists" step
          # reuses it -- this is what resets the idle clock.
          sleep 1800

          # Stop the app and unmount cleanly before detaching -- the DB disk is
          # persistent and must survive this instance's deletion untouched.
          ssh -i ~/.ssh/uat_key ubuntu@uat.nitians.in '
            sudo bash -c "cd /var/discourse && ./launcher stop uat"
            sudo umount /var/discourse/shared/uat
          '
          aws lightsail detach-disk --disk-name uat-nitians-db-disk
          until [ "$(aws lightsail get-disk --disk-name uat-nitians-db-disk --query disk.isAttached --output text)" = "False" ]; do
            sleep 3
          done

          aws lightsail detach-static-ip --static-ip-name uat-nitians-ip
          aws lightsail delete-instance --instance-name uat-nitians

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/uat_key
