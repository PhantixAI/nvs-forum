## UAT (multisite) container for uat.navodians.com / uat.nitians.in / uat.iitians.in.
## Runs on a dedicated, ephemeral Lightsail instance (created from a snapshot per
## deploy cycle, deleted after ~30 min of inactivity — see docs/UAT.md). Mirrors
## production's multisite topology (same hooks/initializers/nginx patch) with one
## deliberate exception: the database is local PostgreSQL, not RDS (3 logical
## databases under the same local role instead of production's shared RDS instance).

templates:
  ## Local PostgreSQL (not RDS) — data lives at /shared/postgres_data, which is
  ## the host's /var/discourse/shared/uat, which is a persistent Lightsail block
  ## storage disk attached/mounted by deploy-uat.yml on every create — survives
  ## the instance's own 30-min idle-delete cycle. See docs/UAT.md. Now provisions
  ## 3 logical databases (uat_navodians/uat_nitians/uat_iitians) under one local
  ## discourse role — see the after_postgres hook below.
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  - "templates/web.ssl.template.yml"
  - "templates/web.letsencrypt.ssl.template.yml"

expose:
  - "80:80"
  - "443:443"

volumes:
  - volume:
      host: /var/discourse/shared/uat
      guest: /shared
  - volume:
      host: /var/discourse/shared/uat/log/var-log
      guest: /var/log

params:
  db_default_text_search_config: "pg_catalog.english"
  db_shared_buffers: "128MB"
  db_work_mem: "10MB"
  ## Default local database name created by postgres.template.yml's own create_db
  ## script -- named for the navodians site so it needs no extra renaming; the
  ## other two logical databases (uat_nitians/uat_iitians) are created by the
  ## after_postgres hook below, under the same default db_user (discourse).
  db_name: uat_navodians
  ## Overwritten per-run by .github/workflows/deploy-uat.yml with either "master"
  ## or the triggering PR's head SHA, so UAT always reflects the exact commit
  ## that triggered the deploy rather than always tracking master.
  version: <UAT_VERSION>
  ## Replace <GITHUB_PAT> with a fine-grained token (Contents: read-only) for PhantixAI/nvs-forum
  git_url: https://oauth2:<GITHUB_PAT>@github.com/PhantixAI/nvs-forum.git

env:
  LANG: en_US.UTF-8
  ## 2 workers, matching production's worker count.
  UNICORN_WORKERS: 2

  ## ===== DISCOURSE BASE =====
  DISCOURSE_HOSTNAME: uat.navodians.com
  DISCOURSE_HOSTNAME_ALIASES: uat.nitians.in,uat.iitians.in
  DISCOURSE_DEVELOPER_EMAILS: 'phantixai@gmail.com'

  ## No DISCOURSE_DB_* block: with postgres.template.yml included, Discourse
  ## defaults to the local socket and db_name/db_user (uat_navodians/discourse
  ## above), never touching production's shared RDS instance. The other two
  ## logical databases (uat_nitians/uat_iitians) are named directly in
  ## config/multisite.uat.yml, copied into place by the after_code hook below.

  ## ===== AMAZON SES SMTP =====
  ## Dedicated UAT sending identity (uat.navodians.com) -- no longer shares
  ## production's SES identity/domain reputation.
  DISCOURSE_SMTP_ADDRESS: email-smtp.ap-south-1.amazonaws.com
  DISCOURSE_SMTP_PORT: 587
  DISCOURSE_SMTP_USER_NAME: '<UAT_DISCOURSE_SMTP_USERNAME>'
  DISCOURSE_SMTP_PASSWORD: '<UAT_DISCOURSE_SMTP_PASSWORD>'
  DISCOURSE_SMTP_AUTHENTICATION: login
  DISCOURSE_SMTP_ENABLE_START_TLS: true
  DISCOURSE_SMTP_DOMAIN: uat.navodians.com
  ## Per-site notification_email is set in each site's DB (site_settings table)
  ## Do NOT set DISCOURSE_NOTIFICATION_EMAIL here — it would override all sites globally

  ## ===== LET'S ENCRYPT =====
  LETSENCRYPT_ACCOUNT_EMAIL: phantixai@gmail.com

  ## ===== S3 + CLOUDFRONT (separate buckets/CDN from any production resource) =====
  DISCOURSE_USE_S3: true
  DISCOURSE_S3_REGION: ap-south-1
  DISCOURSE_S3_ACCESS_KEY_ID: '<UAT_DISCOURSE_S3_ACCESS_KEY_ID>'
  DISCOURSE_S3_SECRET_ACCESS_KEY: '<UAT_DISCOURSE_S3_SECRET_ACCESS_KEY>'
  ## Global S3 bucket (required for GlobalSetting.use_s3? to return true).
  ## Per-site bucket is overridden in each site's DB (s3_upload_bucket site setting).
  ## uat.navodians.com → uat-navodians-forum-uploads / cdn.uat.navodians.com
  ## uat.nitians.in    → uat-nitians-forum-uploads   / cdn.uat.nitians.in
  ## uat.iitians.in    → uat-iitians-forum-uploads   / cdn.uat.iitians.in
  DISCOURSE_S3_BUCKET: uat-navodians-forum-uploads
  DISCOURSE_S3_USE_ACLS: false
  ## Empty override so baked-in image value doesn't shadow per-site DB settings
  DISCOURSE_S3_CDN_URL: ""
  ## CDN URL for compiled assets — see note below about per-site routing.
  DISCOURSE_CDN_URL: "https://cdn.uat.navodians.com"
  ## No DISCOURSE_BACKUP_LOCATION / DISCOURSE_S3_BACKUP_BUCKET: UAT does not mirror
  ## production's S3-backed backups (no parity benefit for catching code regressions,
  ## only added spend/complexity).

hooks:
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          - git clone https://oauth2:<GITHUB_PAT>@github.com/PhantixAI/nvs-follow.git
          - git clone https://oauth2:<GITHUB_PAT>@github.com/PhantixAI/nvs-authentication-validations.git
    ## config/multisite.uat.yml is checked into this same repo with real, final content --
    ## UAT's local Postgres uses trust/peer auth over the Unix socket, so (unlike
    ## production's config/multisite.yml, which carries a real RDS password and must stay
    ## secret-filled-at-deploy-time) there is nothing secret in it to keep out of git. This
    ## hook copies it over config/multisite.yml inside this one UAT build only -- the repo's
    ## own config/multisite.yml (production's) is never touched.
    - exec:
        cmd:
          - cp $home/config/multisite.uat.yml $home/config/multisite.yml
  # Same pnpm pin workaround as containers/app.yml -- see that file for the full
  # explanation (ERR_PNPM_INVALID_DEPENDENCY_NAME on scoped self-typed peers).
  before_yarn:
    - exec:
        cd: $home
        cmd:
          - npm install -g pnpm@10.34.5
  ## postgres.template.yml (vendored from discourse_docker, not in this repo) only
  ## provisions one local database by default, via its own create_db script (run on
  ## a hook point it tags "postgres"). db_name above (uat_navodians) makes that
  ## default database correctly named for the navodians site; after_postgres is
  ## pups' supported insertion point immediately after that step (see
  ## discourse_docker's samples/data.yml for the same pattern, there used to set a
  ## password) -- used here to idempotently create the other two logical databases
  ## under the same default db_user (discourse), with the same extensions
  ## create_db already creates for the default database. createdb's "|| true" and
  ## psql's "create extension if not exists" make this safe to run on every
  ## container start, not just the first.
  after_postgres:
    - exec:
        cmd:
          - |
            su postgres -c "createdb -O discourse uat_nitians" || true
            su postgres -c "createdb -O discourse uat_iitians" || true
            su postgres -c "psql uat_nitians -c 'create extension if not exists hstore;'"
            su postgres -c "psql uat_nitians -c 'create extension if not exists pg_trgm;'"
            su postgres -c "psql uat_nitians -c 'create extension if not exists vector;'"
            su postgres -c "psql uat_iitians -c 'create extension if not exists hstore;'"
            su postgres -c "psql uat_iitians -c 'create extension if not exists pg_trgm;'"
            su postgres -c "psql uat_iitians -c 'create extension if not exists vector;'"
  ## UAT is now genuinely multisite (3 logical databases, see after_postgres above),
  ## so multisite:migrate must run -- verbatim from app.yml.
  after_db_migrate:
    - exec:
        cd: $home
        cmd:
          - su discourse -c 'bundle exec rake multisite:migrate'

run:
  - exec: echo "Beginning of custom commands"
  ## Permanent multisite fix: patch configure-ssl at the source.
  ## configure-ssl runs on every container start and rewrites 20-https.conf,
  ## always adding a single-site "if ($http_host != DISCOURSE_HOSTNAME)" redirect
  ## that would otherwise break every hostname alias. We remove that block from
  ## configure-ssl itself so it never gets written. Copied verbatim from app.yml --
  ## this is load-bearing for multisite UAT working at all, not just parity: without
  ## it, uat.nitians.in/uat.iitians.in would 301-redirect to uat.navodians.com.
  ## Unlike app.yml, there's no per-domain www->apex redirect block here (no
  ## 25-multisite.conf outlet file) -- UAT has no www.uat.* hostnames (see
  ## DISCOURSE_HOSTNAME_ALIASES above), so that block would have nothing to match.
  - file:
      path: /usr/local/bin/patch-configure-ssl
      contents: |
        #!/usr/bin/env python3
        remove = (
            '\nif (\\$http_host != ${DISCOURSE_HOSTNAME}) {\n'
            '  rewrite (.*) https://${DISCOURSE_HOSTNAME}\\$1 permanent;\n'
            '}\n'
        )
        with open('/usr/local/bin/configure-ssl') as f:
            c = f.read()
        if remove in c:
            c = c.replace(remove, '\n')
            with open('/usr/local/bin/configure-ssl', 'w') as f:
                f.write(c)
            print('configure-ssl patched: single-site redirect removed')
        else:
            print('configure-ssl: redirect block not found (already patched?)')
      chmod: "+x"
  - exec: /usr/local/bin/patch-configure-ssl
  ## Per-site CDN initializer: overrides ActionController asset_host per-request so each site
  ## serves compiled JS/CSS from its own CDN (cdn.navodians.com / cdn.nitians.in / cdn.iitians.in).
  ## Uses SiteSetting.s3_cdn_url (already set per-site in DB). Falls back to GlobalSetting.cdn_url
  ## when request context is unavailable (precompilation, mailers, background jobs).
  ## Copied verbatim from app.yml (site-agnostic Ruby) so a bug here shows up identically on UAT.
  - file:
      path: $home/config/initializers/per_site_cdn.rb
      contents: |
        # frozen_string_literal: true
        # Serve compiled JS/CSS from cdn.navodians.com (shared CDN) for all sites.
        # User uploads use SiteSetting.Upload.s3_cdn_url (per-site) — separate code path.
        Rails.application.config.after_initialize do
          ActionController::Base.asset_host = proc do |_source, _request|
            GlobalSetting.cdn_url.presence
          end
        end
  ## Patch SiteSetting::Upload.s3_cdn_url to fall back to the per-site s3_cdn_url when
  ## GlobalSetting.s3_cdn_url is nil (which it is because DISCOURSE_S3_CDN_URL="" —
  ## intentional, since each site has its own CDN). Without this, uploaded file URLs
  ## never get CDN substitution applied and render as raw S3 dualstack URLs.
  ## Copied verbatim from app.yml (site-agnostic Ruby) so a bug here shows up identically on UAT.
  - file:
      path: $home/config/initializers/multisite_s3_cdn_fallback.rb
      contents: |
        # frozen_string_literal: true
        Rails.application.config.after_initialize do
          class << SiteSetting::Upload
            alias_method :_orig_s3_cdn_url, :s3_cdn_url
            def s3_cdn_url
              _orig_s3_cdn_url.presence || SiteSetting.try(:s3_cdn_url).presence
            end

            alias_method :_orig_s3_upload_bucket, :s3_upload_bucket
            def s3_upload_bucket
              SiteSetting.try(:s3_upload_bucket).presence || _orig_s3_upload_bucket
            end
          end
        end
  - exec: echo "End of custom commands"
